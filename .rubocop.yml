inherit_from:
  - https://raw.githubusercontent.com/riboseinc/oss-guides/main/ci/rubocop.yml

AllCops:
  SuggestExtensions: false
  TargetRubyVersion: 3.0

plugins:
  - rubocop-rspec

# The fail-closed schema-subset engine is one keyword dispatcher by
# design: every unimplemented keyword must raise, not fall through.
Metrics/AbcSize:
  Max: 70

Metrics/CyclomaticComplexity:
  Max: 40

Metrics/PerceivedComplexity:
  Max: 30

Metrics/MethodLength:
  Max: 70

Metrics/BlockLength:
  Max: 70

Metrics/ParameterLists:
  Max: 8

# Family style: validators and tool-guard specs describe by string.
RSpec/DescribeClass:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 8

RSpec/ExampleLength:
  Max: 20
